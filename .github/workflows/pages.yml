# Publishes the web version to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Web
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the web folder if missing
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web --project-name almuhra_crossword --org com.almuhra .
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - run: flutter build web --release --base-href /almuhra-crossword/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
