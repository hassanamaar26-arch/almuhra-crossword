name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: core-ts

  flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version (must be 3.19 or newer)
        run: flutter --version
      - name: Create platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,web --project-name almuhra_crossword --org com.almuhra .
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk almuhra-crossword.apk
      - uses: actions/upload-artifact@v4
        with:
          name: almuhra-crossword-apk
          path: almuhra-crossword.apk
      - name: Publish to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "نسخة تجريبية ${{ github.run_number }}"
          body: "نسخة تجريبية تُبنى تلقائياً من آخر تحديث. نزّل الملف almuhra-crossword.apk ونصّبه."
          files: almuhra-crossword.apk
          make_latest: true
